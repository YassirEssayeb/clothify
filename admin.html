<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothify - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header {
            background: var(--primary-color);
            color: #fff;
            padding: 20px 0;
            margin-bottom: 40px;
        }
        .admin-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-table th, .product-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .product-table th {
            background: #f8f8f8;
            font-weight: 600;
        }
        .product-img-small {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .btn-edit { color: #3498db; cursor: pointer; }
        .btn-delete { color: #e74c3c; cursor: pointer; }
        
        .add-product-btn {
            background: var(--accent-color);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 30px;
            width: 500px;
            border-radius: 8px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 24px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--light-gray);
        }
        .admin-tab {
            padding: 12px 28px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #888;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        .admin-tab:hover { color: var(--primary-color); }
        .admin-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }
        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .order-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid var(--accent-color);
        }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .order-card-header h3 { margin: 0; font-size: 16px; }
        .order-status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-processing { background: #cce5ff; color: #004085; }
        .status-shipped { background: #d4edda; color: #155724; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .order-card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        .order-card-items {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }
        .order-card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .order-card-actions select {
            padding: 6px 12px;
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }
        .order-card-actions button {
            padding: 6px 16px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
        }
        .order-card-actions button:hover { background: #d35400; }
        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-orders i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h1>Clothify Admin</h1>
            <div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('products')">Products</button>
            <button class="admin-tab" onclick="switchTab('orders')">Orders</button>
        </div>

        <!-- Products Section -->
        <div id="section-products" class="admin-section active">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Manage Products</h2>
                <button class="add-product-btn" onclick="openModal()">+ Add New Product</button>
            </div>
            <div class="table-wrapper"><table class="product-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- Products will be loaded here -->
                </tbody>
            </table></div>
        </div>

        <!-- Orders Section -->
        <div id="section-orders" class="admin-section">
            <h2>Manage Orders</h2>
            <div id="orders-list">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Add New Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="e.g., Tops, Dresses">
                </div>
                <div class="form-group">
                    <label for="price">Price (€)</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-row" style="display:flex;gap:16px;">
                    <div class="form-group" style="flex:1;">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" min="0" value="10">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label for="rating">Rating (0-5)</label>
                        <input type="number" id="rating" min="0" max="5" step="0.1" value="4.0">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Save Product</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('clothify_token');

        if (!token) {
            window.location.href = 'login.html';
        }

        const productList = document.getElementById('product-list');
        const productForm = document.getElementById('product-form');
        const modal = document.getElementById('product-modal');

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.admin-tab[onclick*="${tab}"]`).classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');
            if (tab === 'orders') fetchOrders();
        }

        // Fetch Products
        async function fetchProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderProducts(products) {
            productList.innerHTML = '';
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${p.image}" class="product-img-small"></td>
                    <td>${p.name}</td>
                    <td>${p.category || 'N/A'}</td>
                    <td>${p.price} €</td>
                    <td>${p.stock}</td>
                    <td class="action-btns">
                        <i class="fa-solid fa-pen-to-square btn-edit" onclick="editProduct(${p.id})"></i>
                        <i class="fa-solid fa-trash btn-delete" onclick="deleteProduct(${p.id})"></i>
                    </td>
                `;
                productList.appendChild(tr);
            });
        }

        // Open Modal for Add
        function openModal() {
            document.getElementById('modal-title').innerText = 'Add New Product';
            productForm.reset();
            document.getElementById('product-id').value = '';
            modal.style.display = 'block';
        }

        // Close Modal
        function closeModal() {
            modal.style.display = 'none';
        }

        // Edit Product
        async function editProduct(id) {
            try {
                const response = await fetch(`${API_URL}/products/${id}`);
                const p = await response.json();
                
                document.getElementById('modal-title').innerText = 'Edit Product';
                document.getElementById('product-id').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('category').value = p.category || '';
                document.getElementById('price').value = p.price;
                document.getElementById('image').value = p.image;
                document.getElementById('description').value = p.description || '';
                document.getElementById('stock').value = p.stock;
                document.getElementById('rating').value = p.rating;
                
                modal.style.display = 'block';
            } catch (error) {
                console.error('Error fetching product:', error);
            }
        }

        // Delete Product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`${API_URL}/products/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    fetchProducts();
                } else {
                    alert('Failed to delete product');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Handle Form Submit (Add/Update)
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('product-id').value;
            const productData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value,
                stock: document.getElementById('stock').value,
                rating: document.getElementById('rating').value
            };

            const url = id ? `${API_URL}/products/${id}` : `${API_URL}/products`;
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    closeModal();
                    fetchProducts();
                } else {
                    const data = await response.json();
                    alert('Error: ' + JSON.stringify(data.errors || data.message));
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Order Management
        async function fetchOrders() {
            const ordersList = document.getElementById('orders-list');
            ordersList.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;color:#888;"></i><p style="margin-top:12px;color:#888;">Loading orders...</p></div>';
            try {
                const response = await fetch(`${API_URL}/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('Failed to fetch');
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                ordersList.innerHTML = '<div class="empty-orders"><i class="fa-solid fa-exclamation-circle"></i><p>Failed to load orders. Make sure the backend is running.</p></div>';
            }
        }

        function renderOrders(orders) {
            const ordersList = document.getElementById('orders-list');
            if (orders.length === 0) {
                ordersList.innerHTML = '<div class="empty-orders"><i class="fa-solid fa-box-open"></i><p>No orders yet.</p></div>';
                return;
            }
            ordersList.innerHTML = '';
            orders.forEach(order => {
                const statusClass = `status-${order.status || 'pending'}`;
                const itemsHtml = (order.items || []).map(item => 
                    `${item.product?.name || 'Product'} x${item.quantity} - ${item.price} €`
                ).join(', ');
                const total = order.items?.reduce((s, i) => s + (i.price * i.quantity), 0) || order.total_amount;

                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-card-header">
                        <h3>Order #${order.id}</h3>
                        <span class="order-status ${statusClass}">${order.status || 'Pending'}</span>
                    </div>
                    <div class="order-card-info">
                        <span><strong>Customer:</strong> ${order.customer_name || 'N/A'}</span>
                        <span><strong>Email:</strong> ${order.customer_email || 'N/A'}</span>
                        <span><strong>Date:</strong> ${new Date(order.created_at).toLocaleDateString()}</span>
                        <span><strong>Total:</strong> ${Number(total).toFixed(2)} €</span>
                        <span><strong>Payment:</strong> ${order.payment_method || 'COD'} (${order.payment_status || 'Pending'})</span>
                        <span><strong>Address:</strong> ${(order.customer_address || '').substring(0, 30)}${(order.customer_address || '').length > 30 ? '...' : ''}</span>
                    </div>
                    ${itemsHtml ? `<div class="order-card-items">Items: ${itemsHtml}</div>` : ''}
                    <div class="order-card-actions">
                        <select id="status-select-${order.id}">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                        <button onclick="updateOrderStatus(${order.id})">Update Status</button>
                    </div>
                `;
                ordersList.appendChild(card);
            });
        }

        async function updateOrderStatus(orderId) {
            const status = document.getElementById(`status-select-${orderId}`).value;
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });
                if (response.ok) {
                    fetchOrders();
                } else {
                    const data = await response.json();
                    alert('Error: ' + (data.message || 'Failed to update'));
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function logout() {
            try {
                await fetch(`${API_URL}/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
            } catch (e) {}
            localStorage.removeItem('clothify_token');
            localStorage.removeItem('clothify_admin');
            window.location.href = 'login.html';
        }

        // Initialize
        fetchProducts();
    </script>
</body>
</html>
